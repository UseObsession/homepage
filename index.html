<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Obsession · The intelligence infrastructure for commercial teams</title>
    <meta
      name="description"
      content="Every sales and marketing decision rests on what prospects, competitors and your own business actually do. Obsession runs the inboxes, phone numbers and browsers to research, sign up, ask, chase and check at any company. You get the proof and your next move."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo/obsession-app-icon-1024.png" />
    <meta name="theme-color" content="#080807" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      /* Before paint: the reader's theme, and a flag that the page's script will run (forms open their steps with it). */
      document.documentElement.classList.add('js')
      try {
        var t = localStorage.getItem('obs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
