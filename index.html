<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Obsession · Intelligence infrastructure for commercial teams</title>
    <meta name="description" content="Declared AI agents with their own inbox, phone number and browser sign up, shop, ask the bot and check at every company on your list. You get signed proof." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#080807" />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <script>
      /* Before paint:
         - a flag that the page's script will run (forms open their steps with it);
         - the reader's theme, and the browser's own bar in the same ink or paper, following every switch (paper is the
           design system's hybrid theme: .ob-theme-hybrid keeps every product object glossy black on it);
         - a host that serves /page.html directly: the router knows that page as /page. */
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          var t = localStorage.getItem('obs-theme')
          if (t === 'light' || t === 'dark') root.dataset.theme = t
        } catch (e) {}
        /* Paper is the design system's hybrid page: every product object stays glossy black on it. */
        root.classList.toggle('ob-theme-hybrid', root.dataset.theme === 'light')
        var bar = document.querySelector('meta[name="theme-color"]')
        var paint = function () {
          if (bar) bar.setAttribute('content', root.dataset.theme === 'light' ? '#F5F4F0' : '#080807')
        }
        paint()
        if (window.MutationObserver) new MutationObserver(paint).observe(root, { attributes: true, attributeFilter: ['data-theme'] })
        var p = location.pathname
        if (/\.html$/.test(p)) history.replaceState(history.state, '', (p.replace(/(\/index)?\.html$/, '') || '/') + location.search + location.hash)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
