<!doctype html>
<html lang="en-GB" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Obsession · The intelligence infrastructure for commercial teams</title>
    <meta
      name="description"
      content="Every sales and marketing decision rests on what prospects, competitors and your own business actually do. Obsession runs the inboxes, phone numbers and browsers to research, sign up, ask, chase and check at any company. You get the proof and your next move."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" />
    <script>
      try {
        var t = localStorage.getItem('obs-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
